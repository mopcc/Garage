name: Capture MurphyBeds Configurator Assets

on:
  workflow_dispatch:
  push:
    branches:
      - tmp-murphybed-configurator-assets
    paths:
      - 'scripts/capture_murphybed_assets.py'
      - 'scripts/capture_murphybed_assets_fast.py'
      - '.github/workflows/capture-murphybed-assets.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Capture configurator assets
        env:
          TARGET_URL: https://www.murphybeds.com/pages/buildabed
          OUTPUT_DIR: murphybed_assets
        run: |
          python scripts/capture_murphybed_assets_fast.py

      - name: Show capture summary
        if: always()
        run: |
          echo '=== Diagnostics ==='
          cat murphybed_assets/diagnostics.json || true
          echo '=== Asset count ==='
          find murphybed_assets/assets -type f 2>/dev/null | wc -l || true
          echo '=== Asset folder size ==='
          du -sh murphybed_assets 2>/dev/null || true

      - name: Create ZIP
        if: always()
        run: |
          if [ -d murphybed_assets ]; then
            zip -r murphybeds-build-your-own-configurator-assets.zip murphybed_assets
          fi

      - name: Upload configurator assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: murphybeds-build-your-own-configurator-assets
          path: |
            murphybeds-build-your-own-configurator-assets.zip
            murphybed_assets/
          if-no-files-found: warn
          retention-days: 7
